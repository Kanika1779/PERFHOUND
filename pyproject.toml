[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfhound"
version = "0.0.1"
description = "Find the commit that made your code slow: LLM-guided, noise-aware performance-regression localization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
embed = ["fastembed>=0.4"]
bench = ["uv>=0.4"]

[project.scripts]
perfhound = "perfhound.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
